{{- /*
  The "#" anchor follows the heading text so headings align with body text.
  It is aria-hidden and out of the tab order, so the heading's accessible
  name is just its text; the table of contents already links every section.
*/ -}}
{{- $id := .Anchor -}}
<h{{ .Level }} id="{{ $id }}">
  {{- .Text -}}
  {{- " " -}}<a class="heading-anchor" href="#{{ $id }}" aria-hidden="true" tabindex="-1">#</a></h{{ .Level }}>
{{- /**/ -}}
