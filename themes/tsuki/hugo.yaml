languageCode: vi
defaultContentLanguage: vi

# llms.txt (https://llmstxt.org) from layouts/index.llmtxt.txt.
# Hugo merges `outputFormats` from the theme but never `outputs`: add `llmtxt`
# to the site's `outputs.home` to get /llms.txt.
outputFormats:
  llmtxt:
    baseName: llms
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
    permalinkable: false

outputs:
  home: [html, rss, llmtxt]

pagination:
  pagerSize: 10
  path: page

taxonomies:
  category: categories
  tag: tags

permalinks:
  post: /:year/:month/:day/:contentbasename/

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingIDType: github-ascii
  highlight:
    noClasses: false
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 60
    - name: date
      weight: 10

params:
  search:
    enable: true
  comments:
    giscus:
      enable: false
  toc:
    enable: true
    minWordCount: 400
  relatedPostsCount: 3
