# Fallback meta description (home page, og:description, twitter:description).
description: Vietnamese developer. Writing about code, work, and the small things in between.

mainSections:
  - post

# Full post content in RSS, not just the summary.
rssFullContent: true
favicon: /favicon.png

social:
  twitter: tienthieusac

# Shown in each post's footer.
license: Licensed under CC BY-NC-SA 4.0

# "Edit this page" link on posts: this prefix + the content file's path.
editURL: https://github.com/tiennm99/blog/edit/main/content/

footer:
  since: 2020
  customText: "Made by miti99 with ❤️"

search:
  enable: true

home:
  recentPostsCount: 5

# Prev/next links on a post stay inside its first category, so a Newsletter
# post links to the previous and next Newsletter.
prevNextNav:
  taxonomy: categories

# Show the post's first category as a chip above the title.
categoryChip:
  enable: true

comments:
  giscus:
    enable: true
    repo: tiennm99/blog
    repoId: R_kgDOILzXrw
    category: Announcements
    categoryId: DIC_kwDOILzXr84CeYAw
    # Threads are keyed by page path; keep it so existing discussions still match.
    mapping: pathname
    strict: "0"
    reactionsEnabled: "1"
    inputPosition: bottom
    theme: preferred_color_scheme
    lang: vi

# Show a TOC on every post that has headings, as Stack did.
toc:
  minWordCount: 1

# Speculation Rules: Chromium prefetches a post's HTML on hover or tap.
prefetch:
  enable: true
