goldmark:
  extensions:
    passthrough:
      enable: true
      delimiters:
        block:
          - - \[
            - \]
          - - $$
            - $$
        inline:
          - - \(
            - \)
  renderer:
    unsafe: true

tableOfContents:
  endLevel: 4
  ordered: true

highlight:
  noClasses: false
  lineNos: true
  tabWidth: 2
