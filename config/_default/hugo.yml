baseurl: https://miti99.com/
languageCode: en
module:
  imports:
    - path: github.com/tiennm99/nocturne
title: miti99
defaultContentLanguage: en
hasCJKLanguage: false
enableRobotsTXT: true
timeZone: Asia/Ho_Chi_Minh
# A post's modified date comes from its front matter `lastmod`, else its
# publish date. Git commit dates are not used, so bulk commits (renames,
# translations) never mark every post as updated.
frontmatter:
  lastmod: [lastmod, date, publishDate]

# TEMPORARY (added 2026-10-04): Cloudflare Pages `_redirects` file that sends
# the old Stack-theme home pagination (/page/N/) to the home page. Posts kept
# their Stack URLs, so they need no redirects. Remove this block and
# layouts/home.redirects together once the old URLs no longer get traffic
# (review at 3, 6 or 12 months after the migration ships).
mediaTypes:
  text/redirects:
    delimiter: ""
    suffixes: [""]
outputFormats:
  redirects:
    baseName: _redirects
    mediaType: text/redirects
    isPlainText: true
    notAlternative: true
outputs:
  home: [html, rss, redirects, llmtxt]
