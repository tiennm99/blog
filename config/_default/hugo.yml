baseURL: https://miti99.com/
module:
  imports:
    - path: github.com/tiennm99/nocturne
title: miti99
defaultContentLanguage: en
enableRobotsTXT: true
timeZone: Asia/Ho_Chi_Minh

# Cloudflare Pages `_redirects` file, built from layouts/home.redirects: old
# Stack-theme pagination, front-matter aliases, the old /post/ section and the
# old /en/ prefix.
mediaTypes:
  text/redirects:
    delimiter: ""
    suffixes: [""]
outputFormats:
  redirects:
    baseName: _redirects
    mediaType: text/redirects
    isPlainText: true
    notAlternative: true
outputs:
  home: [html, rss, redirects, llmtxt]
