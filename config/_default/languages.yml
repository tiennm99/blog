# English is the default and stays at the site root; other languages live
# under /<lang>/. A post gets a translation from a sibling file in its bundle,
# for example index.vi.md next to index.md.
en:
  languageName: English
  languageCode: en
  weight: 1
vi:
  languageName: Tiếng Việt
  languageCode: vi
  weight: 2
  params:
    # Vietnamese copies of the English strings in params.yml.
    description: Lập trình viên người Việt, viết về code, công việc và những chuyện nhỏ thường ngày.
    license: Cấp phép theo CC BY-NC-SA 4.0
    comments:
      giscus:
        lang: vi
